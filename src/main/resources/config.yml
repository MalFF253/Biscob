# Intervalo en segundos entre cada anuncio automático
announcer:
  enabled: true
  interval-seconds: 300
  sound: true
  messages:
    - "&8&m----------------------------------------\n&6&lBISCOB &8» &fRecuerda visitar nuestra tienda oficial en &6tienda.biscob.com\n&8&m----------------------------------------"
    - "&8&m----------------------------------------\n&6&lBISCOB &8» &f¿Necesitas ayuda de un miembro del Staff? Usa &6/soporte <mensaje>\n&8&m----------------------------------------"
    - "&8&m----------------------------------------\n&6&lBISCOB &8» &fEvita estafas al comerciar con otros jugadores usando &6/trade <jugador>\n&8&m----------------------------------------"
    - "&8&m----------------------------------------\n&6&lBISCOB &8» &fUsa &6/shop &fpara comprar y vender recursos en el servidor.\n&8&m----------------------------------------"

support:
  staff-groups:
    - "helper"
    - "mod"
    - "admin"
    - "owner"

trade:
